<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <span class="brand-icon">◈</span>
      <h1>FaceBook</h1>
      <p>Creează un cont nou</p>
    </div>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Nume utilizator</label>
      <input type="text" [(ngModel)]="username" placeholder="username" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="email@exemplu.com" />
    </div>

    <div class="form-group">
      <label>Parolă</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="register()" />
    </div>

    <button (click)="register()" class="btn-primary" [disabled]="loading">
      {{ loading ? 'Se creează contul...' : 'Înregistrare' }}
    </button>

    <p class="auth-link">
      Ai deja cont? <a routerLink="/login">Autentifică-te</a>
    </p>
  </div>
</div>
