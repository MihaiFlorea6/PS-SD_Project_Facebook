name: CI - Verificare Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name:  Descarca sursele
        uses: actions/checkout@v3

      - name:  Pregateste mediul (Node.js)
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Versiunea folosita de Angular

      - name:  Instaleaza dependintele (Librariile)
        run: npm install

      - name:  Construieste aplicatia (Build Check)
        run: npm run build --if-present
