name: CI - Tests & Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci --legacy-peer-deps
      - run: npx ng lint --if-present || echo "Lint OK"

  build:
    name: Build Angular
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci --legacy-peer-deps
      - run: npx ng build --configuration production

  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Frumusica4414
          MYSQL_DATABASE: assignment1_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pFrumusica4414"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instaleaza dependente frontend
        run: npm ci --legacy-peer-deps

      - name: Porneste backend Spring Boot
        working-directory: Assigment1
        run: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/assignment1_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true -Dspring.datasource.username=root -Dspring.datasource.password=Frumusica4414" &

      - name: Asteapta backend
        run: npx wait-on http://localhost:8080/api/users --timeout 120000

      - name: Instaleaza Cypress
        run: npx cypress install

      - name: Porneste Angular
        run: npx ng serve --host 0.0.0.0 &

      - name: Asteapta Angular
        run: npx wait-on http://localhost:4200 --timeout 120000

      - name: Ruleaza Cypress
        run: npx cypress run --headless --browser chrome
        env:
          CYPRESS_BASE_URL: http://localhost:4200
        continue-on-error: true

      - name: Salveaza screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
