name: CI - Tests & Lint

on:
  push:
    branches: [ main, frontend-app ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instaleaza dependente
        run: npm ci

      - name: Ruleaza lint
        run: npm run lint --if-present

  build:
    name: Build Angular
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instaleaza dependente
        run: npm ci

      - name: Build productie
        run: npm run build -- --configuration production

  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instaleaza dependente
        run: npm ci

      - name: Porneste aplicatia in background
        run: npm start &
        env:
          CI: true

      - name: Asteapta sa porneasca serverul
        run: npx wait-on http://localhost:4200 --timeout 60000

      - name: Ruleaza teste Cypress
        run: npx cypress run --headless

      - name: Salveaza screenshots la erori
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
