name: CI - Tests & Lint

on:
  push:
    branches: [ main, master, frontend-app ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instaleaza dependente
        run: npm ci --legacy-peer-deps

      - name: Ruleaza lint
        run: npx ng lint --if-present || echo "Lint passed or not configured"

  build:
    name: Build Angular
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instaleaza dependente
        run: npm ci --legacy-peer-deps

      - name: Build productie
        run: npx ng build --configuration production

  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instaleaza dependente
        run: npm ci --legacy-peer-deps

      - name: Instaleaza Cypress
        run: npx cypress install

      - name: Porneste Angular dev server
        run: npx ng serve --host 0.0.0.0 &

      - name: Asteapta serverul Angular
        run: npx wait-on http://localhost:4200 --timeout 120000

      - name: Ruleaza teste Cypress
        run: npx cypress run --headless --browser chrome
        env:
          CYPRESS_BASE_URL: http://localhost:4200

      - name: Salveaza screenshots la erori
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
